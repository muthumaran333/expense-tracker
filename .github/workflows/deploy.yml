name: Deployment

on:
  workflow_run:
    workflows:
      - Docker Build and Push
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  staging-deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/expense-tracker-github-actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Stage deployment placeholder
        run: |
          aws ecs update-service \
            --cluster expense-tracker \
            --service expense-tracker-backend \
            --force-new-deployment
          aws ecs update-service \
            --cluster expense-tracker \
            --service expense-tracker-frontend \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster expense-tracker \
            --services expense-tracker-backend expense-tracker-frontend
          echo "Staging deployment completed."

  production-deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Production deployment status
        run: |
          echo "Production deployment is intentionally blocked until the AWS production infrastructure, approval rules, and ECS resources are configured."
          echo "No production deployment was performed."
