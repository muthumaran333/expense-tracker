name: Deployment

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  staging-deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/expense-tracker-github-actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Stage deployment placeholder
        run: |
          echo "Staging deployment pipeline is prepared."
          echo "ECS/Fargate and environment infrastructure still need to be created before this can actually deploy." 
          echo "Current ECR push is performed by the Docker Build workflow."

  production-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Production deployment status
        run: |
          echo "Production deployment is intentionally blocked until the AWS production infrastructure, approval rules, and ECS resources are configured."
          echo "No production deployment was performed."
